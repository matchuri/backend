spring:
  datasource:
    url: jdbc:h2:mem:matchuri;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  docker:
    compose:
      enabled: false

logging:
  level:
    root: WARN
    matchuri.backend: INFO

matchuri:
  auth:
    jwt:
      secret: test-jwt-secret-key-test-jwt-secret-key-test-jwt-secret-key
      issuer: matchuri-test
      access-token-expiration-seconds: 3600
      refresh-token-expiration-seconds: 1209600
  seed:
    enabled: false
    sample-members-enabled: false
