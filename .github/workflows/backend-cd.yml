name: backend-cd

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL || 'https://app.infisical.com' }}
      INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
      INFISICAL_ENV_SLUG: ${{ secrets.INFISICAL_ENV_SLUG || 'staging' }}
      INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
      EC2_USER: ${{ secrets.EC2_USER }}
      MATCHURI_SPRING_PROFILE: ${{ secrets.MATCHURI_SPRING_PROFILE }}
      DEPLOY_RELEASE_PREFIX: ${{ secrets.DEPLOY_RELEASE_PREFIX || 'backend-staging' }}
      REMOTE_RELEASES_DIR: ${{ secrets.REMOTE_RELEASES_DIR || '/opt/matchuri/backend/releases' }}
      REMOTE_DEPLOY_SCRIPT: ${{ secrets.REMOTE_DEPLOY_SCRIPT || '/opt/matchuri/backend/scripts/deploy.sh' }}
      REMOTE_ENV_FILE: ${{ secrets.REMOTE_ENV_FILE || '/etc/matchuri/backend.env' }}
      REMOTE_SERVICE_NAME: ${{ secrets.REMOTE_SERVICE_NAME || 'matchuri-backend' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          set -euo pipefail
          required_vars=(
            INFISICAL_PROJECT_SLUG
            INFISICAL_IDENTITY_ID
            EC2_HOST
            EC2_USER
            MATCHURI_SPRING_PROFILE
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required workflow variable: ${var_name}" >&2
              exit 1
            fi
          done

      - name: Fetch secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_API_URL }}

      - name: Validate required secret values
        run: |
          set -euo pipefail
          required_secrets=(
            EC2_SSH_PRIVATE_KEY
            MATCHURI_FRONTEND_ORIGIN
            MATCHURI_DB_PW
            MATCHURI_JWT_SECRET
            MATCHURI_GOOGLE_CLIENT_ID
            MATCHURI_GOOGLE_CLIENT_SECRET
            MATCHURI_COOKIE_SECURE
            MATCHURI_COOKIE_SAME_SITE
          )

          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required secret from Infisical: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build backend jar
        env:
          SPRING_DOCKER_COMPOSE_ENABLED: "false"
          MATCHURI_SPRING_PROFILE: test
        run: ./gradlew --no-daemon clean build

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          release_file="${DEPLOY_RELEASE_PREFIX}-${GITHUB_SHA}.jar"
          echo "RELEASE_FILE=${release_file}" >> "$GITHUB_ENV"
          echo "JAR_PATH=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)" >> "$GITHUB_ENV"

      - name: Validate build artifact
        run: |
          set -euo pipefail
          if [ -z "${JAR_PATH:-}" ] || [ ! -f "${JAR_PATH}" ]; then
            echo "Executable boot jar not found under build/libs" >&2
            exit 1
          fi

      - name: Render backend.env
        run: |
          set -euo pipefail
          {
            echo "MATCHURI_SPRING_PROFILE=${MATCHURI_SPRING_PROFILE}"
            printenv | grep '^MATCHURI_' | grep -v '^MATCHURI_SPRING_PROFILE=' | sort
          } > backend.env

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/matchuri_ec2
          chmod 600 ~/.ssh/matchuri_ec2
          ssh-keyscan -p "${EC2_PORT}" "${EC2_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release artifact and env file
        run: |
          set -euo pipefail
          scp -P "${EC2_PORT}" -i ~/.ssh/matchuri_ec2 "${JAR_PATH}" "${EC2_USER}@${EC2_HOST}:/tmp/${RELEASE_FILE}"
          scp -P "${EC2_PORT}" -i ~/.ssh/matchuri_ec2 backend.env "${EC2_USER}@${EC2_HOST}:/tmp/backend.env"

      - name: Deploy on EC2
        run: |
          set -euo pipefail
          ssh -p "${EC2_PORT}" -i ~/.ssh/matchuri_ec2 "${EC2_USER}@${EC2_HOST}" <<EOF
          set -euo pipefail
          sudo install -m 600 /tmp/backend.env "${REMOTE_ENV_FILE}"
          sudo mv "/tmp/${RELEASE_FILE}" "${REMOTE_RELEASES_DIR}/${RELEASE_FILE}"
          sudo chown matchuri:matchuri "${REMOTE_RELEASES_DIR}/${RELEASE_FILE}"
          sudo MATCHURI_RELEASE_FILE="${RELEASE_FILE}" "${REMOTE_DEPLOY_SCRIPT}"
          sudo systemctl status "${REMOTE_SERVICE_NAME}" --no-pager
          EOF

      - name: Verify service health
        run: |
          set -euo pipefail
          ssh -p "${EC2_PORT}" -i ~/.ssh/matchuri_ec2 "${EC2_USER}@${EC2_HOST}" <<EOF
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health >/tmp/matchuri-health.json
          cat /tmp/matchuri-health.json
          EOF
