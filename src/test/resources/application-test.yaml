spring:
  datasource:
    url: jdbc:h2:mem:matchuri;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - openid
              - profile
              - email

logging:
  level:
    root: WARN
    matchuri.backend: INFO

matchuri:
  auth:
    public-api-patterns:
      - /error
    public-get-api-patterns:
      - /api/v1/members/exists/**
      - /api/v1/auth/oauth2/google
      - /oauth2/authorization/**
      - /login/oauth2/code/**
      - /docs/**
    public-post-api-patterns:
      - /api/v1/members/signup
      - /api/v1/members
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/oauth2/exchange
    public-options-api-patterns:
      - /**
    cors:
      allowed-origins:
        - http://localhost:3000
      allowed-methods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
      exposed-headers:
        - Authorization
      allow-credentials: true
      max-age: 3600
    oauth2:
      frontend-base-url: http://localhost:3000
      success-path: /auth/callback/google
      failure-path: /login
      exchange-code-expiration-seconds: 300
    cookie:
      refresh-token-cookie-name: matchuri_refresh_token
      oauth2-authorization-request-cookie-name: matchuri_oauth2_auth_request
      secure: false
      path: /
      domain:
      same-site: Lax
      max-age-seconds: 1209600
      oauth2-authorization-request-cookie-max-age-seconds: 180
    jwt:
      secret: test-jwt-secret-key-test-jwt-secret-key-test-jwt-secret-key
      issuer: matchuri-test
      access-token-expiration-seconds: 3600
      refresh-token-expiration-seconds: 1209600
  seed:
    enabled: false
    sample-members-enabled: false
